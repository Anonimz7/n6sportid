    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active', 'border-neon', 'text-white'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.add('border-transparent', 'text-slateish'));

            document.getElementById('tab-' + tab).classList.add('active');
            document.getElementById('btn-' + tab).classList.remove('border-transparent', 'text-slateish');
            document.getElementById('btn-' + tab).classList.add('active', 'border-neon', 'text-white');
        }

        function simulateRutin() {
            document.getElementById('r-coach-name').value = "Coach N6 Pro";
            document.getElementById('r-domisili').value = "Jakarta Selatan, DKI Jakarta";
            document.getElementById('r-klien-aktif').value = 12;
            document.getElementById('r-klien-pasif').value = 3;
            document.getElementById('r-client-name').value = "Budi Santoso";
            document.getElementById('r-pb-prev').value = "55:20";
            document.getElementById('r-pb-now').value = "52:10";
            document.getElementById('r-status').value = "Aktif";
            document.getElementById('r-date-start').value = "2026-03-01";
            document.getElementById('r-date-end').value = "2026-03-31";
            document.getElementById('r-progress').value = "Naik Level";
            document.getElementById('r-program-type').value = "Persiapan Khusus";
            document.getElementById('r-program-list').innerHTML = `
                <input type="text" value="Latihan Interval 10x400m" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-xs text-white focus:border-neon outline-none">
                <input type="text" value="Long Run 15km - Pace 6:00" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-xs text-white focus:border-neon outline-none">
            `;
            document.getElementById('r-eval-list').innerHTML = `
                <input type="text" value="Stamina meningkat signifikan" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-xs text-white focus:border-neon outline-none">
                <input type="text" value="Nyeri betis kanan sedikit terasa" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-xs text-white focus:border-neon outline-none">
            `;
        }

        function simulateMasalah() {
            document.getElementById('m-coach-name').value = "Coach N6 Elite";
            document.getElementById('m-client-name').value = "Siti Aminah";
            document.getElementById('m-datetime').value = "2026-03-13T10:00";
            document.getElementById('m-type').value = "Lokasi Tidak Tersedia";
            document.getElementById('m-chrono').value = "Lokasi GBK ditutup mendadak karena acara kenegaraan, client sudah di lokasi.";
            document.getElementById('m-action').value = "Memindahkan sesi ke area lari terdekat (Hutan Kota) dan menyesuaikan menu latihan ke conditioning.";
            document.getElementById('m-saran').value = "Mohon info status ketersediaan GBK di update lebih awal di grup coach.";
            document.getElementById('m-help').value = "Tidak";
            document.getElementById('m-status').value = "Selesai";
        }

        function addItem(listId) {
            const container = document.getElementById(listId);
            const input = document.createElement('input');
            input.type = 'text';
            input.placeholder = listId.includes('prog') ? 'Data lainnya...' : 'Evaluasi lainnya...';
            input.className = 'w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-xs text-white focus:border-neon outline-none';
            container.appendChild(input);
        }

        async function exportRutinPDF() {
            const getVal = id => document.getElementById(id).value || '-';
            const method = document.querySelector('input[name="r-method"]:checked')?.value || 'Online';
            const programs = Array.from(document.getElementById('r-program-list').querySelectorAll('input')).map(i => i.value).filter(v => v);
            const evals = Array.from(document.getElementById('r-eval-list').querySelectorAll('input')).map(i => i.value).filter(v => v);

            const el = document.createElement('div');
            el.style.width = '180mm'; // More conservative width
            el.style.backgroundColor = 'white';
            el.style.color = 'black';
            el.style.fontFamily = 'Arial, sans-serif';
            el.style.margin = '0';
